<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>框选标注 · 手牌 + 碰杠</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c2027; --line: #2c323c;
    --text: #e6e9ef; --dim: #939aa8; --accent: #35d07f; --warn: #f0a33a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    display: grid; grid-template-columns: 132px 1fr 300px; height: 100vh; overflow: hidden;
  }

  /* 左：照片列表 */
  #list { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 8px; }
  .thumb {
    position: relative; width: 100%; aspect-ratio: 3/4; margin-bottom: 8px; border-radius: 6px;
    overflow: hidden; cursor: pointer; border: 2px solid transparent; background: #000;
  }
  .thumb.active { border-color: var(--accent); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; opacity: .55; }
  .thumb.active img { opacity: 1; }
  .thumb .n {
    position: absolute; left: 4px; top: 2px; font-weight: 700; font-size: 13px;
    text-shadow: 0 1px 3px #000;
  }
  .thumb .edited { position: absolute; right: 4px; top: 3px; color: var(--accent); font-size: 12px; }

  /* 中：画布 */
  #stage { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; min-width: 0; }
  #wrap { position: relative; line-height: 0; box-shadow: 0 8px 40px #0009; touch-action: none; }
  #wrap img { display: block; max-height: calc(100vh - 96px); max-width: 100%; user-select: none; -webkit-user-drag: none; }
  #shade { position: absolute; inset: 0; pointer-events: none; }
  #box {
    position: absolute; border: 2px solid var(--accent); box-shadow: 0 0 0 1px #000a inset, 0 0 0 1px #000a;
    cursor: move;
  }
  .h {
    position: absolute; width: 12px; height: 12px; background: var(--accent);
    border: 1px solid #0b0d10; border-radius: 2px;
  }
  .h[data-h="nw"] { left: -7px; top: -7px; cursor: nwse-resize; }
  .h[data-h="ne"] { right: -7px; top: -7px; cursor: nesw-resize; }
  .h[data-h="sw"] { left: -7px; bottom: -7px; cursor: nesw-resize; }
  .h[data-h="se"] { right: -7px; bottom: -7px; cursor: nwse-resize; }
  .h[data-h="n"]  { left: 50%; margin-left: -6px; top: -7px; cursor: ns-resize; }
  .h[data-h="s"]  { left: 50%; margin-left: -6px; bottom: -7px; cursor: ns-resize; }
  .h[data-h="w"]  { top: 50%; margin-top: -6px; left: -7px; cursor: ew-resize; }
  .h[data-h="e"]  { top: 50%; margin-top: -6px; right: -7px; cursor: ew-resize; }
  #hint { color: var(--dim); font-size: 12px; margin-top: 10px; line-height: 1.7; text-align: center; }
  kbd { background: #2b313b; border: 1px solid #3a4150; border-bottom-width: 2px; border-radius: 4px;
        padding: 0 5px; font: 11px ui-monospace, Menlo, monospace; }

  /* 放大镜 */
  #loupe {
    position: fixed; width: 190px; height: 190px; border-radius: 50%; border: 2px solid var(--accent);
    box-shadow: 0 6px 24px #000b; pointer-events: none; display: none; z-index: 50; overflow: hidden;
    background: #000;
  }
  #loupe canvas { display: block; }

  /* 右：信息面板 */
  #side { background: var(--panel); border-left: 1px solid var(--line); padding: 16px; overflow-y: auto; }
  h2 { font-size: 15px; margin: 0 0 4px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 14px; }
  .card { background: #232833; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .card h3 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 0 0 6px; }
  .tiles { font: 13px/1.7 ui-monospace, Menlo, monospace; word-spacing: 3px; }
  .meld { color: var(--warn); }
  table.coords { width: 100%; font: 12px ui-monospace, Menlo, monospace; border-collapse: collapse; }
  table.coords td { padding: 3px 0; }
  table.coords td:first-child { color: var(--dim); width: 34px; }
  button {
    width: 100%; padding: 9px; margin-bottom: 8px; border-radius: 7px; border: 1px solid var(--line);
    background: #2b313b; color: var(--text); font-size: 13px; cursor: pointer;
  }
  button:hover { background: #343b47; }
  button.primary { background: var(--accent); color: #08130c; border-color: transparent; font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  #status { font-size: 12px; color: var(--dim); text-align: center; min-height: 18px; }
  #status.ok { color: var(--accent); }
  #status.err { color: #ff6b6b; }
</style>
</head>
<body>

<div id="list"></div>

<div id="stage">
  <div id="wrap">
    <img id="photo" alt="">
    <svg id="shade"></svg>
    <div id="box">
      <div class="h" data-h="nw"></div><div class="h" data-h="n"></div><div class="h" data-h="ne"></div>
      <div class="h" data-h="w"></div><div class="h" data-h="e"></div>
      <div class="h" data-h="sw"></div><div class="h" data-h="s"></div><div class="h" data-h="se"></div>
    </div>
  </div>
  <div id="hint">
    拖框内移动 · 拖八个把手缩放 · 在框外按住拖动可重画
    &nbsp;·&nbsp; <kbd>←→↑↓</kbd> 移动 &nbsp; <kbd>⇧</kbd>+方向 缩放 &nbsp; <kbd>⌥</kbd> 加速
    &nbsp;·&nbsp; <kbd>J</kbd>/<kbd>K</kbd> 上下一张
  </div>
</div>

<div id="side">
  <h2>框住手牌 + 碰杠</h2>
  <div class="sub">只框这些，尽量贴边；桌上其他人的牌、弃牌堆不要框进去。</div>

  <div class="card">
    <h3>这张应该框住</h3>
    <div class="tiles" id="expect"></div>
  </div>

  <div class="card">
    <h3>坐标（相对 0–1）</h3>
    <table class="coords" id="coords"></table>
  </div>

  <button class="primary" id="save">保存 boxes.json</button>
  <button id="reset">还原这张为初始框</button>
  <button id="reload">从磁盘重新载入</button>
  <div id="status"></div>
</div>

<div id="loupe"><canvas width="190" height="190"></canvas></div>

<script>
const NAMES = ["01","02","03","04","05","06","07","08","09","10","11","12"];

// 每张照片里「应该被框住」的牌，来自 labels.md，仅作对照提示
const LABELS = {
  "01": {hand: "2m 2m 6m 7m 8m 8m 7s 7s 8s 8s", melds: "碰4s"},
  "02": {hand: "7m 8m 9m 7s 7s 8s 8s",           melds: "碰2m + 碰4s"},
  "03": {hand: "7m 7m 7m 2m 2m 2m 4s 4s 4s 8s 8s 8s 8s", melds: ""},
  "04": {hand: "7s",                              melds: "碰7m + 碰2m + 碰4s + 明杠8s"},
  "05": {hand: "4s 4s 4s 2p 4p 5p 6p",            melds: "杠1p + 杠8s"},
  "06": {hand: "1p 1p 1p 2p 4p 5p 6p 4s 4s 4s 8s 8s 8s", melds: ""},
  "07": {hand: "1p 1p 1p 4p 5p 6p 7p 8p 4s 4s 8s 8s 8s", melds: ""},
  "08": {hand: "4p 5p 6p 7p 8p 4s 4s",            melds: "碰1p + 碰8s"},
  "09": {hand: "4p 4p 5p 5p 6p 7p 8p",            melds: "碰1p + 碰8s"},
  "10": {hand: "4p 4p 4p 4p 5p 5p 5p 6p 7p 8p",   melds: "碰1p"},
  "11": {hand: "3p 4p 4p 4p 6p 7p 8p",            melds: "碰1p + 碰5p"},
  "12": {hand: "4m 5m 6m 7m 7m 8m 8m 4p 4p 4p 6p 7p 8p", melds: ""}
};

const $ = s => document.querySelector(s);
const wrap = $("#wrap"), photo = $("#photo"), boxEl = $("#box"), shade = $("#shade");
const loupe = $("#loupe"), lctx = loupe.querySelector("canvas").getContext("2d");

let boxes = {}, initial = {}, current = "01", saveTimer = null;

const clamp01 = v => Math.min(1, Math.max(0, v));

function norm(b) {
  // 保证 w/h 为正，且整体落在 [0,1]
  let {x, y, w, h} = b;
  if (w < 0) { x += w; w = -w; }
  if (h < 0) { y += h; h = -h; }
  x = clamp01(x); y = clamp01(y);
  w = Math.max(0.005, Math.min(w, 1 - x));
  h = Math.max(0.005, Math.min(h, 1 - y));
  return {x, y, w, h};
}

function render() {
  const b = boxes[current];
  boxEl.style.left   = (b.x * 100) + "%";
  boxEl.style.top    = (b.y * 100) + "%";
  boxEl.style.width  = (b.w * 100) + "%";
  boxEl.style.height = (b.h * 100) + "%";

  // 框外压暗，一眼看清框住了什么
  const px = v => (v * 100).toFixed(3);
  shade.innerHTML =
    `<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="position:absolute;inset:0">
       <defs><mask id="m">
         <rect width="100%" height="100%" fill="#fff"/>
         <rect x="${px(b.x)}%" y="${px(b.y)}%" width="${px(b.w)}%" height="${px(b.h)}%" fill="#000"/>
       </mask></defs>
       <rect width="100%" height="100%" fill="#000" opacity="0.55" mask="url(#m)"/>
     </svg>`;

  $("#coords").innerHTML = ["x","y","w","h"]
    .map(k => `<tr><td>${k}</td><td>${b[k].toFixed(4)}</td></tr>`).join("");

  const L = LABELS[current] || {hand: "", melds: ""};
  $("#expect").innerHTML =
    `${L.hand}` + (L.melds ? `<br><span class="meld">${L.melds}</span>` : "");

  document.querySelectorAll(".thumb").forEach(t => t.classList.toggle("active", t.dataset.n === current));
  markEdited();
}

function markEdited() {
  NAMES.forEach(n => {
    const t = document.querySelector(`.thumb[data-n="${n}"] .edited`);
    if (!t) return;
    const a = boxes[n], b = initial[n];
    const changed = !b || ["x","y","w","h"].some(k => Math.abs(a[k] - b[k]) > 1e-4);
    t.textContent = changed ? "●" : "";
  });
}

function select(n) { current = n; photo.src = `/preview/${n}.jpg`; render(); }

// ---------- 拖拽 ----------
let drag = null;

function ptr(e) {
  const r = photo.getBoundingClientRect();
  return {
    x: clamp01((e.clientX - r.left) / r.width),
    y: clamp01((e.clientY - r.top) / r.height),
    cx: e.clientX, cy: e.clientY
  };
}

wrap.addEventListener("pointerdown", e => {
  const handle = e.target.dataset.h;
  const p = ptr(e);
  const b = {...boxes[current]};
  if (handle)                    drag = {mode: "resize", handle, start: p, orig: b};
  else if (e.target === boxEl)   drag = {mode: "move",   start: p, orig: b};
  else                           drag = {mode: "draw",   start: p, orig: {x: p.x, y: p.y, w: 0, h: 0}};
  wrap.setPointerCapture(e.pointerId);
  showLoupe(p);
  e.preventDefault();
});

wrap.addEventListener("pointermove", e => {
  const p = ptr(e);
  if (drag) {
    const dx = p.x - drag.start.x, dy = p.y - drag.start.y;
    const o = drag.orig;
    let b;
    if (drag.mode === "move") {
      b = {x: Math.min(1 - o.w, Math.max(0, o.x + dx)), y: Math.min(1 - o.h, Math.max(0, o.y + dy)), w: o.w, h: o.h};
    } else if (drag.mode === "draw") {
      b = {x: o.x, y: o.y, w: p.x - o.x, h: p.y - o.y};
    } else {
      b = {...o};
      const H = drag.handle;
      if (H.includes("w")) { b.x = o.x + dx; b.w = o.w - dx; }
      if (H.includes("e")) { b.w = o.w + dx; }
      if (H.includes("n")) { b.y = o.y + dy; b.h = o.h - dy; }
      if (H.includes("s")) { b.h = o.h + dy; }
    }
    boxes[current] = norm(b);
    render();
  }
  if (drag) showLoupe(p);
});

wrap.addEventListener("pointerup", e => {
  if (drag) { drag = null; queueSave(); }
  loupe.style.display = "none";
  wrap.releasePointerCapture(e.pointerId);
});

// ---------- 放大镜 ----------
function showLoupe(p) {
  if (!photo.naturalWidth) return;
  const Z = 3.5, S = 190;
  const sx = p.x * photo.naturalWidth  - (S / 2) / Z;
  const sy = p.y * photo.naturalHeight - (S / 2) / Z;
  lctx.fillStyle = "#000"; lctx.fillRect(0, 0, S, S);
  lctx.imageSmoothingEnabled = false;
  lctx.drawImage(photo, sx, sy, S / Z, S / Z, 0, 0, S, S);
  lctx.strokeStyle = "#35d07f"; lctx.lineWidth = 1;
  lctx.beginPath();
  lctx.moveTo(S/2, 0); lctx.lineTo(S/2, S); lctx.moveTo(0, S/2); lctx.lineTo(S, S/2);
  lctx.stroke();
  loupe.style.display = "block";
  loupe.style.left = (p.cx + 26) + "px";
  loupe.style.top  = (p.cy - S - 20) + "px";
}

// ---------- 键盘 ----------
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey) return;
  const i = NAMES.indexOf(current);
  if (e.key === "j" || e.key === "J") { select(NAMES[(i + 1) % NAMES.length]); return; }
  if (e.key === "k" || e.key === "K") { select(NAMES[(i - 1 + NAMES.length) % NAMES.length]); return; }
  const dirs = {ArrowLeft: [-1,0], ArrowRight: [1,0], ArrowUp: [0,-1], ArrowDown: [0,1]};
  if (!dirs[e.key]) return;
  e.preventDefault();
  const step = (e.altKey ? 0.01 : 0.001) * (e.shiftKey ? 1 : 1);
  const [ux, uy] = dirs[e.key];
  const b = {...boxes[current]};
  if (e.shiftKey) { b.w += ux * step; b.h += uy * step; }   // 缩放右/下边
  else            { b.x += ux * step; b.y += uy * step; }   // 整体移动
  boxes[current] = norm(b);
  render(); queueSave();
});

// ---------- 保存 ----------
function queueSave() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 500); }

async function save() {
  const s = $("#status");
  try {
    const r = await fetch("/save", {method: "POST",
      body: JSON.stringify({name: current, box: boxes[current]})});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    s.className = "ok";
    s.textContent = "已保存 " + new Date().toLocaleTimeString();
  } catch (err) {
    s.className = "err";
    s.textContent = "保存失败：" + err.message;
  }
}

$("#save").onclick = save;
$("#reload").onclick = async () => {
  const r = await fetch("/boxes.json?" + Date.now());
  boxes = await r.json();
  render();
  $("#status").className = ""; $("#status").textContent = "已从磁盘重新载入";
};
$("#reset").onclick = () => { boxes[current] = {...initial[current]}; render(); queueSave(); };

// ---------- 启动 ----------
(async function init() {
  const r = await fetch("/boxes.json?" + Date.now());
  boxes = await r.json();
  NAMES.forEach(n => { if (!boxes[n]) boxes[n] = {x: .1, y: .5, w: .8, h: .2}; });
  initial = JSON.parse(JSON.stringify(boxes));

  $("#list").innerHTML = NAMES.map(n =>
    `<div class="thumb" data-n="${n}"><img src="/preview/${n}.jpg" alt="${n}">
       <span class="n">${n}</span><span class="edited"></span></div>`).join("");
  document.querySelectorAll(".thumb").forEach(t => t.onclick = () => select(t.dataset.n));

  select("01");
})();
</script>
</body>
</html>
